<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#120a1f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M32 3 L40 23 L62 25 L45.5 39.5 L51 61 L32 49 L13 61 L18.5 39.5 L2 25 L24 23 Z' fill='%23d98c99'/><circle cx='32' cy='30' r='7' fill='%23fff6fa' opacity='.65'/></svg>">
<title>敏老师和璇老师的100颗回忆星</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --night-1: #120a1f;
    --night-2: #241134;
    --night-3: #3a1e4d;
    --star-shape: polygon(50% 0%, 65% 30%, 98% 35%, 74% 58%, 79% 90%, 50% 75%, 21% 90%, 26% 58%, 2% 35%, 35% 30%);
    --star-dim: #7c6a7e;
    --star-glow: #e8a5b0;
    --star-bright: #faf5f0;
    --pink: #e8a5b0;
    --pink-deep: #c97b8c;
    --pink-soft: #f4c2c2;
    --gold: #e8d5a0;
    --cream: #faf5f0;
    --pink-mist: rgba(232, 165, 176, 0.35);
    --card: rgba(250, 245, 240, 0.96);
    --ink: #3d2b2b;
    --ink-soft: #8a6f68;
  }

  html, body {
    height: 100%;
    font-family: 'Yuanti SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    overflow: hidden;
  }

  body {
    background: linear-gradient(165deg, var(--night-1) 0%, var(--night-2) 48%, var(--night-3) 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(112deg, transparent 26%, rgba(244, 194, 194, 0.14) 45%, rgba(196, 176, 224, 0.22) 54%, rgba(232, 165, 176, 0.12) 63%, transparent 80%),
      radial-gradient(ellipse 62% 42% at 22% 18%, rgba(232, 165, 176, 0.16) 0%, transparent 62%),
      radial-gradient(ellipse 52% 44% at 82% 80%, rgba(196, 176, 224, 0.16) 0%, transparent 64%),
      radial-gradient(ellipse 90% 30% at 50% 52%, rgba(244, 194, 194, 0.05) 0%, transparent 72%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== 全屏细密星点层（JS 生成 200+ 颗） ===== */
  .starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  /* 背景星点：纯装饰，暗小、无光晕、无描边，绝不与五角星混淆 */
  .starfield .bg-star,
  .sky-bg-star {
    position: absolute;
    border-radius: 50%;
    background: var(--cream);
    box-shadow: none;
    pointer-events: none;
  }

  /* 少量背景星用极细十字，丰富层次但依旧很暗 */
  .starfield .bg-star.mini-cross,
  .sky-bg-star.mini-cross {
    border-radius: 0;
    background:
      linear-gradient(var(--cream), var(--cream)) center / 1px 100% no-repeat,
      linear-gradient(var(--cream), var(--cream)) center / 100% 1px no-repeat;
  }

  .sky-bg-star { z-index: 0; }

  .starfield .bg-star.twinkle,
  .sky-bg-star.twinkle { animation: star-twinkle var(--tw, 4s) ease-in-out infinite; }

  @keyframes star-twinkle {
    0%, 100% { opacity: var(--o, 0.3); }
    50% { opacity: calc(var(--o, 0.3) + 0.16); }
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    height: 100%;
    max-height: 940px;
    display: flex;
    flex-direction: column;
    padding: 22px 18px 14px;
  }

  /* ===== 顶部标题 ===== */
  .app-header { text-align: center; position: relative; padding-bottom: 6px; }

  .kitty-badge { width: 46px; height: 40px; margin: 0 auto 10px; position: relative; }
  .kitty-face-svg { display: block; }

  .app-title {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #fff 0%, var(--pink-soft) 50%, #fff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }

  .app-sub { font-size: 11.5px; color: rgba(255, 255, 255, 0.5); letter-spacing: 0.5px; }

  /* ===== 进度 ===== */
  .progress {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 12px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.62);
  }

  .progress .num {
    font-size: 20px;
    font-weight: 800;
    color: var(--pink-soft);
    text-shadow: 0 0 16px rgba(232, 165, 176, 0.8);
  }

  .progress .track {
    width: 120px; height: 5px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
    margin-left: 6px;
  }

  .progress .fill {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--pink), var(--pink-soft));
    box-shadow: 0 0 10px var(--pink-mist);
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* ===== 星空 ===== */
  .sky-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; margin: 10px 0; }

  .sky {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 100%;
    border-radius: 24px;
    background:
      radial-gradient(circle at 50% 42%, rgba(232, 165, 176, 0.14) 0%, transparent 62%),
      radial-gradient(ellipse 68% 52% at 70% 28%, rgba(232, 213, 160, 0.12) 0%, transparent 66%),
      linear-gradient(165deg, rgba(18, 10, 31, 0.32) 0%, rgba(26, 11, 46, 0.5) 100%);
    border: 1px solid rgba(232, 165, 176, 0.13);
    box-shadow: inset 0 0 70px rgba(58, 30, 77, 0.55), 0 0 40px rgba(18, 10, 31, 0.5);
  }

  /* 星空内斜向银河光带 */
  .sky::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(112deg, transparent 30%, rgba(244, 194, 194, 0.18) 46%, rgba(232, 213, 160, 0.16) 55%, rgba(232, 165, 176, 0.10) 64%, transparent 80%);
    filter: blur(10px);
    opacity: 0.8;
    pointer-events: none;
    z-index: 0;
  }

  /* 参考图气质的可爱点缀：心形 + 十字星（柔和粉彩，纯装饰） */
  .sky-deco {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
    border-radius: inherit;
    opacity: 0.72;
  }

  .deco-heart { fill: var(--pink-soft); stroke: var(--pink); stroke-width: 0.6; }
  .deco-heart.deep { fill: var(--pink); stroke: none; }
  .deco-cross { fill: var(--gold); opacity: 0.85; }
  .deco-cross.soft { fill: var(--cream); opacity: 0.75; }

  .moon {
    position: absolute;
    top: -14px; right: 6px;
    width: 70px; height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #fffaf2 0%, #f7e6c8 48%, var(--gold) 100%);
    box-shadow: 0 0 34px rgba(244, 213, 200, 0.5), 0 0 70px rgba(232, 213, 160, 0.3);
    opacity: 0.9;
    z-index: 2;
  }

  .moon::after {
    content: '';
    position: absolute;
    top: 12px; left: -8px;
    width: 58px; height: 58px;
    border-radius: 50%;
    background: var(--night-2);
    opacity: 0.92;
  }

  .kitty-corner { position: absolute; z-index: 2; opacity: 0.55; pointer-events: none; }
  .kitty-corner.tl { top: 10px; left: 10px; transform: rotate(-8deg); }
  .kitty-corner.br { bottom: 12px; right: 12px; transform: rotate(10deg); }

  /* 星星 */
  .star {
    position: absolute;
    width: 28px; height: 28px;
    margin: -14px 0 0 -14px;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
    z-index: 3;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* 描边层：粉色五角星轮廓（提供"召唤感"的轮廓基底） */
  .star::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.12);
    opacity: 0.6;
    transition: background 0.4s ease, opacity 0.4s ease, filter 0.4s ease;
    pointer-events: none;
    -webkit-clip-path: var(--star-shape);
    clip-path: var(--star-shape);
  }

  /* 脉冲提示环：仅"可点亮"星显示，缓慢扩散淡出（伪元素，不占点击区） */
  .star::after {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    border: 1.5px solid var(--pink);
    opacity: 0;
    pointer-events: none;
    z-index: -1;
    box-shadow: 0 0 6px rgba(232, 165, 176, 0.55);
  }

  /* 五角星内芯（clip-path 星形，圆润饱满） */
  .star .dot {
    position: absolute;
    inset: 3px;
    background: radial-gradient(circle at 50% 42%, rgba(58, 30, 77, 0.72) 0%, rgba(26, 13, 34, 0.88) 82%);
    opacity: 0.9;
    transition: all 0.45s ease;
    -webkit-clip-path: var(--star-shape);
    clip-path: var(--star-shape);
  }

  .star .spark {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, #fffaf2 0%, var(--star-glow) 42%, transparent 72%);
    opacity: 0;
    transform: scale(0.3);
    transition: all 0.5s ease;
    -webkit-clip-path: var(--star-shape);
    clip-path: var(--star-shape);
  }

  /* ---- 未点亮可点亮态：粉描边 + 柔和外发光 + 脉冲提示环 ---- */
  .star:not(.lit):not(.locked):not(.empty) {
    filter: drop-shadow(0 0 7px rgba(232, 165, 176, 0.45));
  }

  .star:not(.lit):not(.locked):not(.empty)::before {
    background: var(--pink);
    opacity: 0.92;
    filter: drop-shadow(0 0 6px rgba(232, 165, 176, 0.75));
  }

  .star:not(.lit):not(.locked):not(.empty)::after {
    animation: star-ring 2.6s ease-out infinite;
    animation-delay: var(--d, 0s);
  }

  .star:not(.lit):not(.locked):not(.empty) .dot {
    animation: dim-pulse 3.4s ease-in-out infinite;
    animation-delay: var(--d, 0s);
  }

  @keyframes star-ring {
    0% { transform: scale(0.55); opacity: 0.75; }
    70% { opacity: 0; }
    100% { transform: scale(2.35); opacity: 0; }
  }

  @keyframes dim-pulse {
    0%, 100% { opacity: 0.55; transform: scale(0.86); }
    50% { opacity: 0.98; transform: scale(1); }
  }

  /* ---- 已点亮：暖粉→淡金渐变填充 + 明显光晕 ---- */
  .star.lit::before {
    background: linear-gradient(150deg, var(--gold), var(--pink-soft) 58%, var(--pink));
    opacity: 1;
    filter: drop-shadow(0 0 8px rgba(244, 194, 194, 0.8));
  }

  .star.lit .dot {
    background: linear-gradient(150deg, #fffaf2 0%, #f9dce0 42%, var(--pink) 74%, var(--gold) 100%);
    opacity: 1;
  }

  .star.lit {
    filter: drop-shadow(0 0 8px var(--pink-soft)) drop-shadow(0 0 18px var(--pink));
  }

  .star.lit .spark { opacity: 0.9; transform: scale(2.4); }
  .star.lit { animation: lit-float 4s ease-in-out infinite; animation-delay: var(--d, 0s); }

  @keyframes lit-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  /* ---- 空位（缺号）：更暗，无光晕、无脉冲 ---- */
  .star.empty { cursor: default; }
  .star.empty::before {
    background: rgba(255, 255, 255, 0.05);
    opacity: 0.4;
    filter: none;
  }

  .star.empty .dot {
    background: rgba(255, 255, 255, 0.05);
    box-shadow: none;
    animation: none;
    opacity: 0.4;
  }

  /* ---- 冷却锁定：置灰，无光晕、无脉冲 ---- */
  .star.locked { cursor: not-allowed; }
  .star.locked::before {
    background: #4a3f4e;
    opacity: 0.45;
    filter: none;
  }

  .star.locked .dot {
    background: #3d3442;
    opacity: 0.45;
    animation: none;
    transform: scale(0.82);
  }

  .star:not(.lit):not(.locked):not(.empty):hover { transform: scale(1.22); }

  .star.burst .spark { animation: burst 0.9s ease-out forwards; }

  @keyframes burst {
    0% { opacity: 1; transform: scale(0.4); }
    60% { opacity: 1; transform: scale(3.4); }
    100% { opacity: 0; transform: scale(4.2); }
  }

  .ray {
    position: absolute;
    left: 50%; top: 50%;
    width: 2px; height: 22px;
    margin-left: -1px;
    background: linear-gradient(to bottom, var(--pink-soft), transparent);
    border-radius: 2px;
    transform-origin: top center;
    opacity: 0;
    pointer-events: none;
    z-index: 4;
  }

  .star.brigade .ray { animation: ray-out 0.8s ease-out forwards; }

  @keyframes ray-out {
    0% { opacity: 0; transform: rotate(var(--a)) translateY(0) scaleY(0.3); }
    40% { opacity: 1; }
    100% { opacity: 0; transform: rotate(var(--a)) translateY(var(--dist, 34px)) scaleY(1.6); }
  }

  /* ===== 底部冷却栏 ===== */
  .cooldown-bar {
    border-radius: 18px;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(232, 165, 176, 0.14);
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 62px;
    transition: background 0.4s;
  }

  .cd-icon { font-size: 20px; line-height: 1; }
  .cd-text { flex: 1; }
  .cd-title { font-size: 12.5px; font-weight: 700; color: var(--pink-soft); margin-bottom: 2px; }
  .cd-sub { font-size: 11px; color: rgba(255, 255, 255, 0.48); }

  .cd-timer {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    min-width: 68px;
    text-align: right;
  }

  .cd-timer.ready { color: var(--pink-soft); font-size: 15px; }
  .cooldown-bar.ready { background: rgba(232, 165, 176, 0.12); }

  /* ===== 左侧许愿瓶 ===== */
  .wish-bottle-wrap {
    position: fixed;
    left: clamp(10px, calc(50% - 352px), 42vw);
    top: 50%;
    transform: translateY(-50%);
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }

  .bottle-count {
    pointer-events: auto;
    padding: 5px 14px;
    border-radius: 20px;
    background: rgba(201, 123, 140, 0.18);
    border: 1px solid rgba(232, 165, 176, 0.4);
    color: var(--pink-soft);
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: 0.5px;
    white-space: nowrap;
    box-shadow: 0 0 20px rgba(232, 165, 176, 0.28);
    font-variant-numeric: tabular-nums;
  }

  .bottle {
    pointer-events: auto;
    border: none;
    background: transparent;
    padding: 0;
    cursor: pointer;
    width: 100px;
    filter: drop-shadow(0 6px 22px rgba(232, 165, 176, 0.4));
    transition: transform 0.3s ease, filter 0.3s ease;
  }

  .bottle:hover { transform: translateY(-4px) scale(1.04); }
  .bottle:active { transform: scale(0.97); }

  .bottle-svg { display: block; width: 100%; height: auto; }

  .bottle.flash { filter: drop-shadow(0 0 30px rgba(232, 165, 176, 0.95)); }
  .bottle.flash .bottle-glow { animation: bottle-flash 0.85s ease; }
  .bottle.flash .bottle-body { animation: bottle-body-flash 0.85s ease; }

  @keyframes bottle-flash {
    0% { opacity: 0; }
    35% { opacity: 1; }
    100% { opacity: 0; }
  }

  @keyframes bottle-body-flash {
    0%, 100% { filter: none; }
    40% { filter: brightness(1.6) drop-shadow(0 0 18px #f4c2c2); }
  }

  /* ===== 记录卡片弹窗 ===== */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 70;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(26, 13, 34, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .modal.show { display: flex; animation: fade-in 0.35s ease; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  .card {
    position: relative;
    width: 100%;
    max-width: 400px;
    max-height: 86vh;
    overflow-y: auto;
    overflow-x: hidden;
    border-radius: 24px;
    padding: 30px 26px 24px;
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(232, 165, 176, 0.5), 0 0 44px rgba(232, 165, 176, 0.35);
    animation: card-in 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes card-in {
    from { opacity: 0; transform: scale(0.82) translateY(24px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .card::before {
    content: '';
    position: absolute;
    top: -50px; right: -50px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232, 165, 176, 0.22) 0%, transparent 70%);
    pointer-events: none;
  }

  .card-num {
    display: inline-flex;
    align-items: baseline;
    gap: 2px;
    padding: 5px 14px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 1px;
    box-shadow: 0 4px 14px rgba(201, 123, 140, 0.4);
    position: relative;
    z-index: 1;
  }

  .card-num .hash { font-size: 11px; opacity: 0.8; }

  .card-body {
    margin: 20px 0 12px;
    font-size: 15.5px;
    line-height: 1.85;
    color: var(--ink);
    letter-spacing: 0.2px;
    position: relative;
    z-index: 1;
    min-height: 26px;
  }

  .card-body .ch { opacity: 0; animation: ch-in 0.4s ease forwards; }

  @keyframes ch-in {
    from { opacity: 0; transform: translateY(6px); filter: blur(3px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  .card-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201, 123, 140, 0.25), transparent);
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }

  /* ===== 回应区 ===== */
  .reply-zone {
    position: relative;
    z-index: 1;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.34, 1.4, 0.64, 1);
  }

  .reply-zone.show { opacity: 1; transform: translateY(0); }

  .reply-guide {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--pink-deep);
    letter-spacing: 0.3px;
    margin-bottom: 10px;
    line-height: 1.6;
  }

  .reply-existing {
    margin-bottom: 10px;
    padding: 12px 14px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(244, 213, 214, 0.55), rgba(250, 245, 240, 0.9));
    border: 1px dashed rgba(201, 123, 140, 0.3);
  }

  .reply-existing-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 11.5px;
    font-weight: 800;
    color: var(--pink-deep);
    margin-bottom: 6px;
  }

  .reply-time {
    font-weight: 600;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .reply-existing-text {
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .reply-empty {
    font-size: 12.5px;
    color: var(--ink-soft);
    text-align: center;
    padding: 4px 0;
  }

  .reply-text {
    width: 100%;
    min-height: 74px;
    resize: vertical;
    border-radius: 14px;
    border: 1px solid rgba(201, 123, 140, 0.28);
    background: rgba(255, 255, 255, 0.85);
    padding: 11px 13px;
    font-family: inherit;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink);
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
  }

  .reply-text:focus {
    border-color: var(--pink-deep);
    box-shadow: 0 0 0 3px rgba(201, 123, 140, 0.14);
  }

  .reply-actions {
    margin-top: 10px;
    display: flex;
    justify-content: flex-end;
  }

  .reply-btn {
    border: none;
    border-radius: 14px;
    padding: 10px 22px;
    font-size: 13px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, var(--pink), var(--pink-deep));
    box-shadow: 0 6px 16px rgba(201, 123, 140, 0.34);
    transition: transform 0.2s;
    font-family: inherit;
    letter-spacing: 0.5px;
  }

  .reply-btn:active { transform: scale(0.96); }

  .card-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(201, 123, 140, 0.1);
    color: var(--pink-deep);
    font-size: 17px;
    cursor: pointer;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ===== 管理入口 ===== */
  .admin-bar {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 90;
    display: none;
    gap: 8px;
  }

  .admin-bar.show { display: flex; }

  .admin-btn {
    border: 1px solid rgba(232, 165, 176, 0.4);
    background: rgba(201, 123, 140, 0.18);
    color: var(--pink-soft);
    font-family: inherit;
    font-size: 11.5px;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
  }

  .admin-btn:active { transform: scale(0.96); }

  /* ===== 银河视图 ===== */
  .galaxy {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 52%, #3a2040 0%, #2a1538 62%, #150a1f 100%);
  }

  .galaxy.show { display: block; animation: fade-in 0.45s ease; }

  .galaxy-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(115deg, transparent 26%, rgba(232, 165, 176, 0.20) 47%, rgba(196, 176, 224, 0.16) 56%, transparent 74%),
      radial-gradient(circle at 28% 66%, rgba(232, 165, 176, 0.24) 0%, transparent 42%),
      radial-gradient(circle at 74% 30%, rgba(196, 176, 224, 0.20) 0%, transparent 44%),
      radial-gradient(circle at 50% 50%, rgba(250, 245, 240, 0.06) 0%, transparent 60%);
  }

  .galaxy-fog { position: absolute; inset: 0; pointer-events: none; }

  .galaxy-fog span {
    position: absolute;
    border-radius: 50%;
    background: #faf5f0;
    opacity: 0;
    animation: fog-twinkle 3.4s ease-in-out infinite;
  }

  @keyframes fog-twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 0.9; transform: scale(1.1); }
  }

  .galaxy-stars { position: absolute; inset: 0; z-index: 2; }

  .g-star {
    position: absolute;
    width: 26px; height: 26px;
    margin: -13px 0 0 -13px;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
    transition: transform 0.3s ease;
  }

  .g-star .g-dot {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, #fffaf2 0%, #f9dce0 40%, var(--pink-soft) 78%, transparent 100%);
    animation: g-float 4s ease-in-out infinite;
    animation-delay: var(--d, 0s);
    -webkit-clip-path: var(--star-shape);
    clip-path: var(--star-shape);
  }

  .g-star { filter: drop-shadow(0 0 7px var(--pink-soft)) drop-shadow(0 0 15px rgba(232, 165, 176, 0.6)); }

  @keyframes g-float {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.28); opacity: 1; }
  }

  .g-star:hover { transform: scale(1.25); }

  .galaxy-empty {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 13px;
    color: rgba(255, 255, 255, 0.6);
    text-align: center;
    width: 80%;
  }

  .galaxy-head {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 20px;
  }

  .galaxy-title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 22px rgba(232, 165, 176, 0.8);
  }

  .galaxy-close {
    position: absolute;
    top: 14px; right: 16px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(232, 165, 176, 0.35);
    background: rgba(201, 123, 140, 0.16);
    color: var(--pink-soft);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .galaxy-foot {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 5;
    display: flex;
    justify-content: center;
    padding: 18px;
  }

  .galaxy-random {
    border: 1px solid rgba(232, 165, 176, 0.45);
    background: linear-gradient(135deg, rgba(232, 165, 176, 0.28), rgba(201, 123, 140, 0.4));
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 11px 26px;
    border-radius: 24px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(201, 123, 140, 0.32);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  .galaxy-random:active { transform: scale(0.97); }

  /* ===== 回应互动效果 ===== */
  .ascend {
    position: fixed;
    inset: 0;
    z-index: 110;
    display: none;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 50%, rgba(232, 165, 176, 0.26) 0%, rgba(30, 15, 40, 0.82) 68%);
    pointer-events: none;
  }

  .ascend.show { display: flex; animation: fade-in 0.4s ease; }

  .ascend-sparks { position: absolute; inset: 0; overflow: hidden; }

  .ascend-spark {
    position: absolute;
    left: 50%; top: 62%;
    width: 7px; height: 7px;
    margin: -3.5px 0 0 -3.5px;
    border-radius: 50%;
    background: #faf5f0;
    box-shadow: 0 0 14px var(--pink-soft);
    animation: spark-rise 1.4s ease-out forwards;
  }

  @keyframes spark-rise {
    0% { opacity: 0; transform: translate(0, 0) scale(0.4); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.3); }
  }

  .ascend-text {
    position: relative;
    z-index: 2;
    max-width: 82%;
    text-align: center;
    font-size: 17px;
    font-weight: 800;
    line-height: 1.9;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 0 26px rgba(232, 165, 176, 0.95);
    animation: ascend-pop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes ascend-pop {
    0% { opacity: 0; transform: scale(0.7) translateY(14px); }
    55% { opacity: 1; transform: scale(1.06) translateY(-4px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* ===== 飞行星星 ===== */
  .fly-star {
    position: fixed;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, var(--pink-soft) 45%, var(--pink) 100%);

    pointer-events: none;
    transition: transform 0.95s cubic-bezier(0.4, 0.05, 0.3, 1), opacity 0.95s ease;
  }

  /* ===== 100 颗彩蛋 ===== */
  .finale {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 45%, rgba(232, 165, 176, 0.22) 0%, rgba(30, 15, 40, 0.92) 70%);

  }

  .finale.show { display: flex; }

  .finale-stars { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }

  .finale-stars .fs {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--star-bright);
    box-shadow: 0 0 10px var(--pink-soft);
    opacity: 0;
    animation: fs-twinkle 2.6s ease-in-out infinite;
  }

  @keyframes fs-twinkle {
    0%, 100% { opacity: 0; transform: scale(0.4); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  .finale-content { position: relative; z-index: 1; text-align: center; padding: 30px; max-width: 440px; animation: card-in 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .finale-kitty { width: 62px; height: 54px; margin: 0 auto 18px; }
  .finale-text { font-size: 18px; line-height: 2; font-weight: 700; color: #fff; letter-spacing: 1px; text-shadow: 0 0 24px rgba(232, 165, 176, 0.85); }
  .finale-close {
    margin-top: 24px;
    border: 1px solid rgba(232, 165, 176, 0.5);
    background: rgba(201, 123, 140, 0.2);
    color: var(--pink-soft);
    font-family: inherit;
    font-size: 13px;
    padding: 10px 24px;
    border-radius: 22px;
    cursor: pointer;
  }

  /* ===== 轻提示 ===== */
  .toast {
    position: fixed;
    bottom: 96px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    z-index: 120;
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 12.5px;
    color: #fff;
    background: rgba(201, 123, 140, 0.9);
    box-shadow: 0 8px 24px rgba(201, 123, 140, 0.4);
    opacity: 0;
    transition: all 0.35s ease;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 响应式 ===== */
  @media (max-height: 720px) {
    .app-header { padding-bottom: 2px; }
    .kitty-badge { display: none; }
    .app-title { font-size: 18px; }
    .app { padding-top: 16px; }
  }

  @media (max-width: 380px) {
    .app { padding: 16px 12px 12px; }
    .app-title { font-size: 17px; letter-spacing: 0; }
    .card { padding: 26px 20px 20px; }
    .card-body { font-size: 14.5px; }
  }

  @media (max-width: 760px) {
    .wish-bottle-wrap {
      left: 10px;
      top: auto;
      bottom: 92px;
      transform: none;
      gap: 5px;
    }
    .bottle { width: 58px; }
    .bottle-count { font-size: 10.5px; padding: 3px 10px; }
  }

  @media (min-width: 768px) {
    .app { max-width: 560px; }
    .app-title { font-size: 24px; }
    .bottle { width: 116px; }
  }

  /* ===== 尊重减少动效 ===== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .star::after { display: none; }
    .star:not(.lit) .dot { opacity: 0.85; transform: scale(1); }
    .star.lit { animation: none; }
    .card-body .ch { opacity: 1 !important; filter: none !important; transform: none !important; }
    .reply-zone { opacity: 1 !important; transform: none !important; }
    .finale-stars, .ascend-sparks, .galaxy-fog { display: none; }
    .starfield .bg-star, .sky-bg-star { animation: none; opacity: var(--o, 0.3); }
    .ascend-text { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>

  "09": "蛮神奇的，两个不相信永恒的人。"
};

/* ============================================================
   素材加载：优先 records.json，失败则回退内联数据
   ============================================================ */
let RECORDS = {};

async function loadRecords() {
  let timer = null;
  try {
    const ctrl = new AbortController();
    timer = setTimeout(() => ctrl.abort(), 2500);
    const res = await fetch('./records.json', { cache: 'no-store', signal: ctrl.signal });
    if (!res.ok) throw new Error('bad status ' + res.status);
    const data = await res.json();
    if (data && typeof data === 'object' && !Array.isArray(data)) {
      RECORDS = data;
      return;
    }
    throw new Error('bad data');
  } catch (e) {
    RECORDS = FALLBACK_RECORDS;
  } finally {
    clearTimeout(timer);
  }
}

/* ============================================================
   状态与存储（lit / lastLitAt / responses，兼容旧数据）
   ============================================================ */
const LS_KEY = 'wish-star-state-v1';
let state = loadState();

function loadState() {
  let s = null;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) s = JSON.parse(raw);
  } catch (e) {}
  if (!s || typeof s !== 'object') s = {};
  s.lit = Array.isArray(s.lit) ? s.lit : [];
  s.lastLitAt = typeof s.lastLitAt === 'number' ? s.lastLitAt : 0;
  s.responses = (s.responses && typeof s.responses === 'object' && !Array.isArray(s.responses)) ? s.responses : {};
  return s;
}

function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}

function prefersReduced() {
  try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function formatTime(ts) {
  const d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ============================================================
   渲染星空
   ============================================================ */
const sky = document.getElementById('sky');
const starEls = {};

function rand(seed) {
  const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

/* 全屏细密星点（200+ 颗，含明暗与闪烁变化） */
function buildStarfield() {
  const field = document.getElementById('starfield');
  if (!field) return;
  const n = prefersReduced() ? 150 : 240;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    const isCross = i % 9 === 0;
    s.className = 'bg-star';
    const sz = isCross
      ? (3 + rand(i * 4.2) * 1.5).toFixed(2)
      : (0.8 + rand(i * 1.37) * 0.8).toFixed(2);
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    s.style.left = (rand(i * 2.71) * 100).toFixed(2) + '%';
    s.style.top = (rand(i * 3.91) * 100).toFixed(2) + '%';
    const o = (0.15 + rand(i * 5.7) * 0.25) * (isCross ? 0.85 : 1);
    s.style.setProperty('--o', o.toFixed(2));
    s.style.opacity = o.toFixed(2);
    if (isCross) s.classList.add('mini-cross');
    if (i % 4 === 0) {
      s.classList.add('twinkle');
      s.style.setProperty('--tw', (3 + rand(i * 7.1) * 5).toFixed(1) + 's');
      s.style.animationDelay = (rand(i * 9.3) * 5).toFixed(2) + 's';
    }
    frag.appendChild(s);
  }
  field.appendChild(frag);
}

/* 星空面板内补充星点，增强浩瀚感 */
function buildSkyStars() {
  const n = prefersReduced() ? 70 : 110;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    const isCross = i % 7 === 0;
    s.className = 'sky-bg-star';
    const sz = isCross
      ? (2.5 + rand(i * 4.6) * 1.4).toFixed(2)
      : (0.8 + rand(i * 1.61) * 0.8).toFixed(2);
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    s.style.left = (rand(i * 2.13) * 100).toFixed(2) + '%';
    s.style.top = (rand(i * 3.47) * 100).toFixed(2) + '%';
    const o = (0.15 + rand(i * 6.1) * 0.23) * (isCross ? 0.85 : 1);
    s.style.opacity = o.toFixed(2);
    if (isCross) s.classList.add('mini-cross');
    if (i % 3 === 0) {
      s.classList.add('twinkle');
      s.style.setProperty('--o', o.toFixed(2));
      s.style.setProperty('--tw', (3 + rand(i * 7.7) * 5).toFixed(1) + 's');
      s.style.animationDelay = (rand(i * 9.9) * 5).toFixed(2) + 's';
    }
    frag.appendChild(s);
  }
  sky.appendChild(frag);
}

function buildSky() {
  for (let i = 0; i < CONFIG.TOTAL; i++) {
    const num = String(i + 1).padStart(2, '0');
    const col = i % 10;
    const row = Math.floor(i / 10);
    const x = ((col + 0.5 + (rand(i * 2.3) - 0.5) * 0.55) / 10) * 100;
    const y = ((row + 0.5 + (rand(i * 3.7) - 0.5) * 0.55) / 10) * 100;

    const btn = document.createElement('button');
    btn.className = 'star' + (RECORDS[num] ? '' : ' empty');
    if (!RECORDS[num]) { btn.title = '待补充空位'; btn.setAttribute('aria-label', '待补充空位'); }
    btn.style.left = x + '%';
    btn.style.top = y + '%';
    btn.style.setProperty('--d', (rand(i * 5.1) * 3).toFixed(2) + 's');
    btn.dataset.num = num;

    const dot = document.createElement('span');
    dot.className = 'dot';
    const spark = document.createElement('span');
    spark.className = 'spark';
    btn.appendChild(dot);
    btn.appendChild(spark);

    for (let r = 0; r < 8; r++) {
      const ray = document.createElement('span');
      ray.className = 'ray';
      ray.style.setProperty('--a', (r * 45) + 'deg');
      ray.style.setProperty('--dist', (26 + rand(i + r) * 14).toFixed(0) + 'px');
      btn.appendChild(ray);
    }

    if (RECORDS[num]) {
      btn.addEventListener('click', () => onStarClick(num, btn));
    }
    sky.appendChild(btn);
    starEls[num] = btn;
  }
  state.lit.forEach(num => { if (starEls[num]) starEls[num].classList.add('lit'); });
}

/* ============================================================
   点亮逻辑
   ============================================================ */
function onStarClick(num, btn) {
  if (state.lit.includes(num)) { openCard(num); return; }
  if (state.lit.length >= CONFIG.TOTAL) { showToast('全部的星星都已经点亮啦 ✨'); return; }
  if (isCoolingDown()) { showToast('星光还在凝聚，稍等一会儿再点亮下一颗吧 ✨'); return; }
  if (dailyBlocked()) { showToast('今天的星星已经点亮完啦，明天再来吧 ✨'); return; }

  btn.classList.add('burst', 'brigade', 'lit');
  playChime();
  state.lit.push(num);
  state.lastLitAt = Date.now();
  markDaily();
  saveState();
  updateProgress();
  updateCooldownUI();
  setTimeout(() => openCard(num), 420);
  setTimeout(() => btn.classList.remove('burst', 'brigade'), 1000);

  if (state.lit.length >= CONFIG.TOTAL) setTimeout(triggerFinale, 1200);
}

function isCoolingDown() {
  if (!state.lastLitAt) return false;
  return (Date.now() - state.lastLitAt) < CONFIG.COOLDOWN_SECONDS * 1000;
}

function dailyBlocked() {
  if (!CONFIG.DAILY_UNLOCK_MODE) return false;
  const today = new Date().toDateString();
  let rec = {};
  try { rec = JSON.parse(localStorage.getItem(LS_KEY + '-daily') || '{}'); } catch (e) {}
  if (rec.date !== today) return false;
  return (rec.count || 0) >= CONFIG.DAILY_UNLOCK_COUNT;
}

function markDaily() {
  if (!CONFIG.DAILY_UNLOCK_MODE) return;
  const today = new Date().toDateString();
  let rec = {};
  try { rec = JSON.parse(localStorage.getItem(LS_KEY + '-daily') || '{}'); } catch (e) {}
  if (rec.date !== today) rec = { date: today, count: 0 };
  rec.count = (rec.count || 0) + 1;
  try { localStorage.setItem(LS_KEY + '-daily', JSON.stringify(rec)); } catch (e) {}
}

function updateProgress() {
  const n = state.lit.length;
  document.getElementById('progressNum').textContent = n;
  document.getElementById('progressFill').style.width = (n / CONFIG.TOTAL * 100) + '%';
}

/* ============================================================
   许愿瓶：计数 + 瓶内光点
   ============================================================ */
const SVG_NS = 'http://www.w3.org/2000/svg';

function collectedCount() {
  return Object.keys(state.responses).filter(k => state.responses[k] && state.responses[k].text).length;
}

function renderBottleDots(n) {
  const g = document.getElementById('bottleDots');
  if (!g) return;
  g.innerHTML = '';
  const count = Math.min(n, 100);
  const colors = ['#faf5f0', '#f4c2c2', '#dba0ac'];
  for (let i = 0; i < count; i++) {
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', (30 + rand(i * 1.7) * 68).toFixed(1));
    c.setAttribute('cy', (92 + rand(i * 2.9) * 88).toFixed(1));
    c.setAttribute('r', (1.3 + rand(i * 3.3) * 1.7).toFixed(1));
    c.setAttribute('fill', colors[i % 3]);
    c.setAttribute('opacity', '0.9');
    g.appendChild(c);
  }
}

function updateBottle() {
  const n = collectedCount();
  const numEl = document.getElementById('bottleCountNum');
  if (numEl) numEl.textContent = n;
  renderBottleDots(n);
}

function flashBottle() {
  const b = document.getElementById('bottleBtn');
  if (!b) return;
  b.classList.add('flash');
  setTimeout(() => b.classList.remove('flash'), 900);
}

/* ============================================================
   冷却 UI
   ============================================================ */
let cdTimer = null;

function updateCooldownUI() {
  const bar = document.getElementById('cooldownBar');
  const title = document.getElementById('cdTitle');
  const sub = document.getElementById('cdSub');
  const timer = document.getElementById('cdTimer');

  if (isCoolingDown()) {
    bar.classList.remove('ready');
    timer.classList.remove('ready');
    title.textContent = '星光正在凝聚…';
    sub.textContent = '下一颗星星点亮倒计时';
    if (CONFIG.LOCK_OTHERS_DURING_CD) lockStars(true);

    clearInterval(cdTimer);
    const tick = () => {
      const remain = CONFIG.COOLDOWN_SECONDS * 1000 - (Date.now() - state.lastLitAt);
      if (remain <= 0) { clearInterval(cdTimer); updateCooldownUI(); return; }
      timer.textContent = fmt(remain);
    };
    tick();
    cdTimer = setInterval(tick, 250);
  } else {
    clearInterval(cdTimer);
    bar.classList.add('ready');
    timer.classList.add('ready');
    timer.textContent = 'READY';
    title.textContent = '现在可以点亮一颗星星';
    sub.textContent = '轻触星空中任意一颗微光星';
    lockStars(false);
  }
}

function lockStars(lock) {
  Object.values(starEls).forEach(el => {
    if (el.classList.contains('lit') || el.classList.contains('empty')) return;
    el.classList.toggle('locked', lock);
  });
}

function fmt(ms) {
  if (ms < 0) ms = 0;
  const s = Math.ceil(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

/* ============================================================
   记录卡片：逐字渐显素材原文 + 写/看回应
   ============================================================ */
let currentNum = null;
let replyRevealTimer = null;

function openCard(num) {
  currentNum = num;
  document.getElementById('cardNum').textContent = num;

  const body = document.getElementById('cardBody');
  body.innerHTML = '';
  const text = RECORDS[num] || '';
  text.split('').forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'ch';
    span.textContent = ch;
    span.style.animationDelay = (i * 0.028) + 's';
    body.appendChild(span);
  });

  renderReply(num);

  const rz = document.getElementById('replyZone');
  rz.classList.remove('show');
  clearTimeout(replyRevealTimer);

  const modal = document.getElementById('modal');
  modal.classList.add('show');
  const cardEl = modal.querySelector('.card');
  if (cardEl) cardEl.scrollTop = 0;

  if (prefersReduced()) {
    rz.classList.add('show');
  } else {
    replyRevealTimer = setTimeout(() => rz.classList.add('show'), Math.max(600, text.length * 28 + 320));
  }
}

function renderReply(num) {
  const existing = document.getElementById('replyExisting');
  const ta = document.getElementById('replyText');
  const btn = document.getElementById('replyBtn');
  const rec = state.responses[num];

  if (rec && rec.text) {
    existing.style.display = 'block';
    existing.innerHTML =
      '<div class="reply-existing-head">你的回应<span class="reply-time">' + escapeHtml(formatTime(rec.time)) + '</span></div>' +
      '<div class="reply-existing-text">' + escapeHtml(rec.text) + '</div>';
    ta.value = rec.text;
    btn.textContent = '更新回应';
  } else {
    existing.style.display = 'block';
    existing.innerHTML = '<div class="reply-empty">这颗星星还没有留下回应</div>';
    ta.value = '';
    btn.textContent = '提交回应';
  }
}

function closeCard() {
  document.getElementById('modal').classList.remove('show');
  clearTimeout(replyRevealTimer);
  currentNum = null;
}

/* ============================================================
   提交回应 → 温馨互动 → 飞入许愿瓶
   ============================================================ */
function submitReply() {
  const num = currentNum;
  if (!num) return;
  const text = (document.getElementById('replyText').value || '').trim();
  if (!text) { showToast('先写点什么，再交给星星吧 ✨'); return; }

  const firstTime = !(state.responses[num] && state.responses[num].text);
  state.responses[num] = { text: text, time: Date.now() };
  saveState();

  closeCard();
  if (document.getElementById('galaxy').classList.contains('show')) closeGalaxy();
  playChime();

  if (firstTime) {
    showAscend(() => flyToBottle(num));
    showToast('回应已收进许愿瓶里啦 💗');
  } else {
    showAscend(null);
    updateBottle();
    showToast('回应已更新 💗');
  }
}

let ascendTimer = null;

function showAscend(cb) {
  const el = document.getElementById('ascend');
  const sparks = document.getElementById('ascendSparks');
  sparks.innerHTML = '';
  if (!prefersReduced()) {
    for (let i = 0; i < 30; i++) {
      const s = document.createElement('span');
      s.className = 'ascend-spark';
      s.style.setProperty('--x', ((rand(i * 2.2) - 0.5) * 260).toFixed(0) + 'px');
      s.style.setProperty('--y', (-70 - rand(i * 3.7) * 200).toFixed(0) + 'px');
      s.style.animationDelay = (rand(i * 1.3) * 0.5).toFixed(2) + 's';
      sparks.appendChild(s);
    }
  }
  el.classList.add('show');
  clearTimeout(ascendTimer);
  ascendTimer = setTimeout(() => {
    el.classList.remove('show');
    if (cb) cb();
  }, prefersReduced() ? 500 : 2300);
}

function flyToBottle(num) {
  const src = starEls[num];
  const target = document.getElementById('wishBottleWrap');
  if (!src || !target || prefersReduced()) {
    flashBottle();
    updateBottle();
    return;
  }

  const s = src.getBoundingClientRect();
  const t = target.getBoundingClientRect();
  if (!s.width && !s.height) { flashBottle(); updateBottle(); return; }

  const size = 18;
  const el = document.createElement('div');
  el.className = 'fly-star';
  el.style.left = (s.left + s.width / 2 - size / 2) + 'px';
  el.style.top = (s.top + s.height / 2 - size / 2) + 'px';
  document.body.appendChild(el);

  const dx = (t.left + t.width / 2) - (s.left + s.width / 2);
  const dy = (t.top + t.height * 0.55) - (s.top + s.height / 2);

  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    if (el.parentNode) el.remove();
    flashBottle();
    updateBottle();
  };

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      el.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(0.45)';
      el.style.opacity = '0.25';
    });
  });

  el.addEventListener('transitionend', finish);
  setTimeout(finish, 1400);
}

      s.style.height = sz + 'px';

      s.style.animationDelay = (rand(i * 5.3) * 3.4).toFixed(2) + 's';

/* ============================================================
   音效（Web Audio 合成轻柔三音阶铃音）
   ============================================================ */
let audioCtx = null;
function playChime() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    [880, 1174, 1568].forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0, now + i * 0.07);
      gain.gain.linearRampToValueAtTime(0.12, now + i * 0.07 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.07 + 0.7);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + i * 0.07);
      osc.stop(now + i * 0.07 + 0.75);
    });
  } catch (e) {}
}
